<script>
/* Live (GitHub) version: all data is saved in ONE FILE on this PC (Chrome / Edge). Nothing is sent to any server. */
(function(){
 if(window.claude)return;
 const SUP='showSaveFilePicker' in window;
 let cache={v:0,c:{}},handle=null,pend=null,chain=Promise.resolve();
 const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('smvm_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
 const idbGet=async()=>{try{const d=await idb();return await new Promise(res=>{const q=d.transaction('h').objectStore('h').get('file');q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}catch(x){return null}};
 const idbSet=async h=>{try{const d=await idb();d.transaction('h','readwrite').objectStore('h').put(h,'file')}catch(x){}};
 async function readFile(){const t=await (await handle.getFile()).text();cache=t.trim()?JSON.parse(t):{v:0,c:{}};if(!cache||typeof cache!=='object')cache={};cache.c=cache.c||{};cache.v=cache.v||0}
 async function writeFile(){const w=await handle.createWritable();await w.write(JSON.stringify(cache));await w.close()}
 function flush(){if(pend)return pend;pend=new Promise((res,rej)=>{setTimeout(()=>{pend=null;chain=chain.then(writeFile).then(res,rej)},300)});return pend}
 window.addEventListener('beforeunload',e=>{if(pend){e.preventDefault();e.returnValue=''}});
 const db={collection:n=>({
  onSnapshot(cb){setTimeout(()=>cb({docs:Object.entries(cache.c[n]||{}).map(([id,d])=>({id,data:()=>d}))}),0)},
  doc:id=>({set:async d=>{(cache.c[n]=cache.c[n]||{})[id]=d;cache.v++;await flush()},delete:async()=>{delete (cache.c[n]||{})[id];cache.v++;await flush()}})})};
 const dl={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}};
 async function connect(){
  const saved=SUP?await idbGet():null;
  if(saved){try{if(await saved.queryPermission({mode:'readwrite'})==='granted'){handle=saved;await readFile();return db}}catch(x){}}
  return new Promise(res=>{
   const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(10,15,25,.75);display:flex;align-items:center;justify-content:center;padding:16px;font:14px system-ui,sans-serif';
   o.innerHTML='<div style="background:#fff;color:#1b2430;border-radius:14px;max-width:470px;width:100%;padding:20px;box-shadow:0 10px 40px #0006"><h2 style="margin:0 0 8px;font-size:18px">Where should your data be saved?</h2><p id="m" style="margin:0 0 14px;color:#4b5563">Your data is kept in one file on this PC. Nothing is sent to any server.</p><div id="b" style="display:flex;flex-direction:column;gap:8px"></div></div>';
   document.body.appendChild(o);
   const m=o.querySelector('#m'),b=o.querySelector('#b'),done=r=>{o.remove();res(r)};
   const btn=(t,f,pri)=>{const x=document.createElement('button');x.textContent=t;x.style.cssText='padding:10px 14px;border-radius:9px;border:1px solid #cbd5e1;font:inherit;cursor:pointer;background:'+(pri?'#0f766e':'#fff')+';color:'+(pri?'#fff':'#1b2430');x.onclick=async()=>{try{await f()}catch(e){if(!e||e.name!=='AbortError')m.textContent='Could not use that file: '+((e&&e.message)||e)}};b.appendChild(x)};
   const use=async h=>{handle=h;await readFile();await idbSet(h);done(db)};
   const perm=async h=>{if(await h.requestPermission({mode:'readwrite'})!=='granted')throw new Error('Permission was not given')};
   const T={types:[{description:'Data file',accept:{'application/json':['.json']}}]};
   if(!SUP){m.textContent='This browser cannot save to a file on your PC. Please use Chrome or Edge on your PC. You can continue now, but the data will stay only inside this browser.';btn('Continue in this browser only',async()=>done(null),1);return}
   if(saved)btn('Reconnect to: '+saved.name,async()=>{await perm(saved);await use(saved)},1);
   btn('Open an existing data file…',async()=>{const[h]=await showOpenFilePicker(T);await perm(h);await use(h)},!saved);
   btn('Create a new data file…',async()=>{const h=await showSaveFilePicker({suggestedName:'smv_master_db.json',...T});await use(h)});
   btn('Use this browser only (no file)',async()=>done(null));
  });
 }
 window.claude={use:async n=>n==='downloads'?dl:n==='db'?await connect():null};
})();
</script>

 if(t==='p'){const m=obm();for(const r of out){r.sheet=(m[r.ob]||{}).sheet;r.size=(m[r.ob]||{}).size||r.size;r.item=(m[r.ob]||{}).item||r.item;r.codeS=r.code?r.code+(r.size?'-'+r.size:''):'';r.tgt=r.smv>0?60/r.smv:null;r.su=(r.smv>0?r.smv:0)*(r.freq>0?r.freq:1);r.tgtU=r.su>0?60/r.su:null}}
 if(0)for(const r of out){r.tgt=r.smv>0?60/r.smv:null}

 const cnt={},oq={};for(const r of rows('o'))if(r.ob){cnt[r.ob]=(cnt[r.ob]||0)+1;oq[r.ob]=(oq[r.ob]||0)+(r.qty||0)}
 return Object.values(a).map(x=>({...x,mach:x.tot-x.man,lnk:cnt[x.id]||0,qty:oq[x.id]||0}))}

 b:{c:[['img','Image'],['sheet','Buyer Name'],['style','Style'],['item','Item'],['size','Size'],['qty','Order Qty','n0'],['nops','Ops','n0'],['tot','Total SMV','f4'],['man','Manual SMV','f4'],['mach','Machine SMV','f4'],['lnk','Orders linked','n0'],['note','Note']],f:'item',l:'All items'},
